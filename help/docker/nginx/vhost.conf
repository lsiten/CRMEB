js_import tenant_headers from /etc/nginx/tenant-headers.js;
js_set $tenant_appid tenant_headers.appid;
js_set $tenant_screct_id tenant_headers.screctId;
log_format tenant_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time';

server {
    listen 80;
    index index.php index.html;
    server_name bz.crmeb.com;
    client_max_body_size 100M;
    underscores_in_headers on;
    access_log /var/log/nginx/access.log tenant_safe;
    error_log /var/log/nginx/error.log warn;

    root /var/www/public;


    location / {
        # try_files $uri /index.php$is_args$args;
        if (!-e $request_filename){
            rewrite  ^(.*)$  /index.php?s=$1  last;   break;
        }
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log off;
        access_log /dev/null;
    }
    
    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log off;
        access_log /dev/null; 
    }
    location /notice {
        proxy_pass http://192.168.10.90:40001/;  
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header appid $tenant_appid;
        proxy_set_header screct_id $tenant_screct_id;
        proxy_set_header screct-id "";
    }
    location /msg {
        proxy_pass http://192.168.10.90:40002/;  
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header appid $tenant_appid;
        proxy_set_header screct_id $tenant_screct_id;
        proxy_set_header screct-id "";
    }
    
   

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass phpfpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_APPID $tenant_appid;
        fastcgi_param HTTP_SCRECT_ID $tenant_screct_id;
        fastcgi_intercept_errors off;
    }
    
   
}
