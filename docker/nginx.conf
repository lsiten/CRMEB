js_import tenant_headers from /etc/nginx/tenant-headers.js;
js_set $tenant_appid tenant_headers.appid;
js_set $tenant_screct_id tenant_headers.screctId;

log_format tenant_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time';

server {
    listen 80 default_server;
    server_name _;
    root /var/www/crmeb/public;
    index index.php index.html;
    client_max_body_size 100M;
    underscores_in_headers on;
    access_log /var/log/nginx/access.log tenant_safe;
    error_log /var/log/nginx/error.log warn;

    location = /healthz { access_log off; return 200 'ok'; }
    location / { try_files $uri $uri/ /index.php?s=$uri&$args; }
    location ~ /\. { deny all; }
    location ~* ^/uploads/.*\.php { deny all; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Replace normalized HTTP_* keys once; never let duplicate raw heads overwrite them.
        fastcgi_param HTTP_APPID $tenant_appid;
        fastcgi_param HTTP_SCRECT_ID $tenant_screct_id;
        fastcgi_intercept_errors off;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300;
    }
    location /notice {
        proxy_pass http://127.0.0.1:40001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header appid $tenant_appid;
        proxy_set_header screct_id $tenant_screct_id;
        proxy_set_header screct-id "";
    }
    location /msg {
        proxy_pass http://127.0.0.1:40002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header appid $tenant_appid;
        proxy_set_header screct_id $tenant_screct_id;
        proxy_set_header screct-id "";
    }
}
